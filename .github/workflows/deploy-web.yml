# Builds the Vectis home page and its apps and publishes them to GitHub Pages on every push to
# master that touches them: Vectis home at the root, Planner at /planner/, Finance at /finance/,
# Record at /record/.
# The Google client ID and API key (Planner's sharing) come from repository
# secrets (Settings → Secrets and variables → Actions), so they stay out of git.

name: Deploy web apps

on:
  push:
    branches: [master]
    paths: ['home/**', 'web/**', 'finance/**', 'record/**', 'suite/**', 'package.json', 'package-lock.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # One install for every app and the shared suite (npm workspaces).
      - run: npm ci
      - run: npm test
      - run: npm run build -w web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          # Sync between devices (one JSON line from the Firebase console).
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      - run: npm run build -w finance
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      - run: npm run build -w record
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      - run: npm run build -w home
      - name: Put the apps on one site
        # The Vectis home page at the root, each app in its own folder.
        run: |
          mkdir site
          cp -r home/dist/. site/
          mkdir site/planner site/finance site/record
          cp -r web/dist/. site/planner/
          cp -r finance/dist/. site/finance/
          cp -r record/dist/. site/record/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
