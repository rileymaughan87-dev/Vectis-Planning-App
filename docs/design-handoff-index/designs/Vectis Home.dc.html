<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;min-height:100%;background:#F2EFE8} body{font-family:Newsreader,Georgia,serif;color:#15171B;-webkit-font-smoothing:antialiased} a{color:#0068B5;text-decoration:none} a:hover{color:#004679}</style>
</helmet>
<div style="min-height:100vh;overflow:hidden;background:#F2EFE8">
  <div style="max-width:560px;margin:0 auto;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:56px;padding:44px 24px 32px">
    <header style="display:flex;flex-direction:column;gap:14px">
      <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;letter-spacing:0.04em;color:#0068B5">00</div>
      <h1 style="margin:0;font-style:italic;font-weight:500;font-size:56px;line-height:0.95;color:#0068B5;letter-spacing:-0.01em">Vectis</h1>
      <div style="font-size:17px;color:#55585F">{{ greeting }} · {{ today }}</div>
    </header>

    <main aria-label="Apps" style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ apps }}" as="app" hint-placeholder-count="3">
        <a href="{{ app.href }}" aria-disabled="{{ app.soon }}" style="display:flex;flex-direction:column;gap:14px;padding:20px 0 0;color:#15171B;opacity:{{ app.opacity }}" style-hover="color:#0068B5">
          <div style="display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:baseline;gap:0 12px">
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;letter-spacing:0.04em;color:#0068B5">{{ app.num }}</span>
            <span style="font-style:italic;font-weight:500;font-size:36px;line-height:1">{{ app.name }}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;letter-spacing:0.06em;color:#0068B5">{{ app.right }}</span>
            <span></span>
            <span style="grid-column:2 / 4;margin-top:8px;font-size:16px;line-height:1.45;color:#55585F;text-wrap:pretty">{{ app.what }}</span>
          </div>
          <div style="position:relative;height:12px;margin-right:-50vw">
            <span style="position:absolute;left:0;top:2px;width:8px;height:8px;border-radius:50%;background:#0068B5"></span>
            <span style="position:absolute;left:4px;right:0;top:5px;height:2px;background:#0068B5"></span>
          </div>
        </a>
      </sc-for>
    </main>

    <footer style="margin-top:auto;font-size:14px;line-height:1.5;color:#6A6D74;text-wrap:pretty">Each app is its own tool; they share your sign-in and sync between your devices.</footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;420px&quot;,&quot;height&quot;:&quot;860px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const now = new Date();
    const h = now.getHours();
    const apps = [
      { num: '01', name: 'Planner', what: 'Goals, your day in time blocks, and the evening review.', href: './planner/' },
      { num: '02', name: 'Finance', what: 'A calm budget, a money calendar, and goals broken into payments.', href: './finance/' },
      { num: '03', name: 'Record', what: 'Journal, notebooks and notes. Moving out of Planner next.' }
    ].map(a => ({ ...a, soon: !a.href, href: a.href, opacity: a.href ? 1 : 0.55, right: a.href ? '→' : 'SOON' }));
    return {
      greeting: h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening',
      today: now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }),
      apps
    };
  }
}
</script>
</body>
</html>
